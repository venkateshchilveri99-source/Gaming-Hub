<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --text-color: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 8px;
            margin-top: 1rem;
            background: #000;
        }
    </style>
</head>
<body>

    <h1>ARCADE HUB</h1>

    <div class="grid">
        <!-- Game 1 -->
        <div class="card">
            <h2>Quantum Guess</h2>
            <iframe src="https://venkateshchilveri99-source.github.io/Number-Guess-game/"></iframe>
        </div>

        <!-- Game 2 -->
        <div class="card">
            <h2>Neo Vectors</h2>
            <iframe src="https://venkateshchilveri99-source.github.io/space-shoot/"></iframe>
        </div>
    </div>

</body>
</html>
