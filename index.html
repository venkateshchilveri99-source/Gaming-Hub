<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VENKY'S ARCADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* SKY BLUE THEME COLOR PALETTE */
            --bg-color: #EFF6FF;
            --card-bg: #FFFFFF;
            --primary-blue: #2563EB;
            --primary-hover: #1D4ED8;
            --accent-cyan: #06B6D4;
            --text-color: #111827;
            --text-sub: #4B5563;
            --border-color: rgba(37, 99, 235, 0.2);
            --accent-gold: #D97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.12), transparent 50%);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 2rem;
        }

        /* NAVIGATION BAR */
        nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.05);
        }

        .nav-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--primary-blue);
            letter-spacing: 2px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 0.8rem;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: var(--text-sub);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid var(--border-color);
        }

        .login-btn-nav {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }

        .login-btn-nav:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        header {
            text-align: center;
            margin: 2rem 0 1.5rem 0;
            padding: 0 1rem;
            width: 100%;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--text-color) 20%, var(--primary-blue) 60%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* MAIN CONTAINER & SECTIONS */
        .main-container {
            width: 100%;
            max-width: 1050px;
            padding: 0 1rem;
        }

        .page-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* GAMES GRID */
        .hub-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.08);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary-blue);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.18);
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-box img, .thumbnail-box svg {
            width: 100%;
            height: 100%;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
        }

        .game-desc {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .play-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, var(--primary-hover), var(--accent-cyan));
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        /* CONTENT CARDS */
        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
        }

        .content-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary-blue);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        /* ABOUT ME PROFILE SECTION */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
        }

        @media (min-width: 600px) {
            .profile-container {
                flex-direction: row;
                text-align: left;
                align-items: flex-start;
            }
        }

        .profile-img-box {
            width: 150px;
            height: 150px;
            min-width: 150px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan));
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.25);
            overflow: hidden;
        }

        .profile-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            border-radius: 50%;
            display: block;
        }

        .profile-info {
            flex: 1;
        }

        /* TABLES */
        .leader-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        .leader-table th, .leader-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .leader-table th {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .rank-badge {
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 50%;
            display: inline-block;
            text-align: center;
        }

        .rank-1 { background: var(--accent-gold); color: #fff; }
        .rank-2 { background: #94a3b8; color: #fff; }
        .rank-3 { background: #b45309; color: #fff; }

        /* ABOUT GAMES GRID */
        .game-about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .game-about-box {
            background: rgba(239, 246, 255, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
        }

        .game-about-box h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .game-about-box p {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* EDGE-TO-EDGE FULLSCREEN OVERLAY */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000;
            z-index: 999999;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            overflow: hidden;
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .floating-controls {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000000;
            pointer-events: none;
        }

        .floating-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            background: var(--primary-blue);
            border: 2px solid #ffffff;
            color: #fff;
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            cursor: pointer;
        }

        .iframe-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            display: block;
        }

        /* LOGIN MODAL */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--primary-blue);
            border-radius: 20px;
            padding: 2.5rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
            position: relative;
        }

        .login-card h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-sub);
            font-size: 1rem;
            letter-spacing: 1px;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-weight: 600;
        }

        footer strong {
            color: var(--primary-blue);
            font-family: 'Orbitron', sans-serif;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
                padding: 0.8rem;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem;
            }
            .nav-link {
                font-size: 0.75rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-logo" onclick="showPage('games')">VENKY'S ARCADE</div>
        <ul class="nav-links">
            <li><a class="nav-link active" id="btn-games" onclick="showPage('games')">GAMES</a></li>
            <li><a class="nav-link" id="btn-scores" onclick="showPage('scores')">HIGH SCORES</a></li>
            <li><a class="nav-link" id="btn-about-games" onclick="showPage('about-games')">ABOUT GAMES</a></li>
            <li><a class="nav-link" id="btn-about-me" onclick="showPage('about-me')">ABOUT ME</a></li>
            <li><button class="login-btn-nav" id="user-login-btn" onclick="openLogin()">LOGIN</button></li>
        </ul>
    </nav>

    <header>
        <h1>VENKY'S GAMING ARCADE</h1>
        <p>Select a title to launch game</p>
    </header>

    <main class="main-container">

        <!-- GAMES PAGE -->
        <section class="page-section active" id="page-games">
            <div class="hub-container">
                
                <!-- Game 1 -->
                <article class="game-card" onclick="openGame('https://venkateshchilveri99-source.github.io/2D-stricker/')">
                    <div class="thumbnail-box">
                        <span class="badge">ARCADE</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice">
                            <rect width="400" height="250" fill="#eff6ff"/>
                            <rect x="25" y="30" width="60" height="15" rx="3" fill="#2563eb"/>
                            <rect x="92" y="30" width="60" height="15" rx="3" fill="#2563eb"/>
                            <rect x="159" y="30" width="60" height="15" rx="3" fill="#2563eb"/>
                            <rect x="226" y="30" width="60" height="15" rx="3" fill="#2563eb"/>
                            <rect x="293" y="30" width="60" height="15" rx="3" fill="#2563eb"/>
                            <circle cx="190" cy="78" r="7" fill="#06b6d4"/>
                            <rect x="140" y="200" width="120" height="12" rx="6" fill="#1d4ed8"/>
                        </svg>
                    </div>
                    <div class="card-body">
                        <div>
                            <h2 class
