<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Gaming Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --text-color: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* Hub Header */
        header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* Hub Cards Layout */
        .hub-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .game-card:active {
            transform: scale(0.98);
        }

        @media (min-width: 768px) {
            .game-card:hover {
                transform: translateY(-6px);
                border-color: var(--accent-cyan);
                box-shadow: 0 12px 30px -5px rgba(0, 240, 255, 0.3);
            }
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .game-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 1.25rem;
        }

        .click-hint {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .pink-accent .click-hint {
            color: var(--accent-pink);
        }

        /* Fullscreen Game Overlay Mobile Fixes */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Mobile dynamic viewport fix */
            background-color: #000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Top Bar inside Fullscreen */
        .overlay-header {
            height: 48px;
            background-color: #111625;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.8rem;
            flex-shrink: 0;
        }

        .back-btn {
            background: linear-gradient(135deg, var(--accent-cyan), #0072ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .active-game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 0.5rem;
        }

        /* Responsive Iframe Container */
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: calc(100% - 48px);
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>ARCADE HUB</h1>
        <p>Tap any game below to play full screen</p>
    </header>

    <main class="hub-container">
        
        <!-- Game 1 Card -->
        <article class="game-card" onclick="openGame('https://venkateshchilveri99-source.github.io/Number-Guess-game/', 'Quantum Guess')">
            <div>
                <h2 class="game-title">Quantum Guess</h2>
                <p class="game-desc">A code-cracking number guessing challenge with dynamic hints.</p>
            </div>
            <span class="click-hint">TAP TO PLAY ➔</span>
        </article>

        <!-- Game 2 Card -->
        <article class="game-card pink-accent" onclick="openGame('https://venkateshchilveri99-source.github.io/space-shoot/', 'Neo Vectors')">
            <div>
                <h2 class="game-title">Neo Vectors</h2>
                <p class="game-desc">A cosmic retro-wave space shooter with waves and flagship boss battles.</p>
            </div>
            <span class="click-hint">TAP TO PLAY ➔</span>
        </article>

    </main>

    <!-- Fullscreen Game Modal -->
    <div class="fullscreen-overlay" id="gameOverlay">
        <div class="overlay-header">
            <button class="back-btn" onclick="closeGame()">← HUB</button>
            <span class="active-game-title" id="activeGameTitle">Game</span>
            <div style="width: 40px;"></div>
        </div>
        <div class="iframe-wrapper">
            <iframe class="game-iframe" id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <script>
        function openGame(url, title) {
            document.body.style.overflow = 'hidden';
            document.getElementById('gameFrame').src = url;
            document.getElementById('activeGameTitle').innerText = title;
            document.getElementById('gameOverlay').classList.add('active');
        }

        function closeGame() {
            document.body.style.overflow = '';
            document.getElementById('gameOverlay').classList.remove('active');
            document.getElementById('gameFrame').src = '';
        }
    </script>

</body>
</html>
