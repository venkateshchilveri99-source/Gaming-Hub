<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VENKY'S ARCADE HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(18, 24, 43, 0.85);
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-purple: #9d00ff;
            --text-color: #ffffff;
            --text-sub: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.1), transparent 50%);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            width: 100%;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 20%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Hub Cards Grid */
        .hub-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 950px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 35px rgba(0, 240, 255, 0.35);
        }

        .game-card:active {
            transform: scale(0.97);
        }

        /* Thumbnail Image Container */
        .thumbnail-box {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #000;
        }

        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover .thumbnail-box img {
            transform: scale(1.08);
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(5, 8, 17, 0.85);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
        }

        .game-desc {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        .play-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
        }

        /* Pink Accent Variant for Space Game */
        .pink-card {
            border-color: rgba(255, 0, 127, 0.3);
        }

        .pink-card:hover {
            border-color: var(--accent-pink);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.35);
        }

        .pink-card .badge {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        .pink-card .play-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }

        /* Fullscreen Overlay with Mobile Scale Fix */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-header {
            height: 50px;
            background-color: #0a0d18;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .active-game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .iframe-viewport {
            flex: 1;
            width: 100%;
            height: calc(100% - 50px);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .scaled-frame-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>NEON ARCADE</h1>
        <p>Select a title to launch game</p>
    </header>

    <main class="hub-container">
        
        <!-- Game 1: Number Guessing -->
        <article class="game-card" onclick="openGame('https://venkateshchilveri99-source.github.io/Number-Guess-game/', 'Quantum Guess')">
            <div class="thumbnail-box">
                <span class="badge">PUZZLE</span>
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop" alt="Quantum Guess Code Matrix">
            </div>
            <div class="card-body">
                <div>
                    <h2 class="game-title">Quantum Guess</h2>
                    <p class="game-desc">A code-cracking number challenge. Guess secret codes with dynamic hints and track your high score.</p>
                </div>
                <button class="play-btn">LAUNCH GAME ➔</button>
            </div>
        </article>

        <!-- Game 2: Space Shooter -->
        <article class="game-card pink-card" onclick="openGame('https://venkateshchilveri99-source.github.io/space-shoot/', 'Neo Vectors')">
            <div class="thumbnail-box">
                <span class="badge">ACTION</span>
                <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=800&auto=format&fit=crop" alt="Neo Vectors Cosmic Nebula">
            </div>
            <div class="card-body">
                <div>
                    <h2 class="game-title">Neo Vectors</h2>
                    <p class="game-desc">Cosmic retro-wave space shooter. Fight enemy waves, dodge obstacles, and defeat boss flagships.</p>
                </div>
                <button class="play-btn">LAUNCH GAME ➔</button>
            </div>
        </article>

    </main>

    <!-- Fullscreen Game Modal -->
    <div class="fullscreen-overlay" id="gameOverlay">
        <div class="overlay-header">
            <button class="back-btn" onclick="closeGame()">← HUB</button>
            <span class="active-game-title" id="activeGameTitle">Game</span>
            <div style="width: 50px;"></div>
        </div>
        <div class="iframe-viewport">
            <div class="scaled-frame-container" id="frameWrapper">
                <iframe class="game-iframe" id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
    </div>

    <script>
        function openGame(url, title) {
            document.body.style.overflow = 'hidden';
            const frame = document.getElementById('gameFrame');
            const wrapper = document.getElementById('frameWrapper');
            
            frame.src = url;
            document.getElementById('activeGameTitle').innerText = title;
            document.getElementById('gameOverlay').classList.add('active');

            if (window.innerWidth < 500 && url.includes('space-shoot')) {
                wrapper.style.transform = 'scale(0.92)';
                wrapper.style.transformOrigin = 'center center';
            } else {
                wrapper.style.transform = 'none';
            }
        }

        function closeGame() {
            document.body.style.overflow = '';
            document.getElementById('gameOverlay').classList.remove('active');
            document.getElementById('gameFrame').src = '';
        }
    </script>

</body>
</html>
