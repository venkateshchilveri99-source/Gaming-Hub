<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VENKY'S ARCADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(18, 24, 43, 0.85);
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-purple: #9d00ff;
            --text-color: #ffffff;
            --text-sub: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.18), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.12), transparent 50%);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            width: 100%;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 10%, var(--accent-cyan) 60%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Hub Cards Grid */
        .hub-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 950px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 35px rgba(0, 240, 255, 0.35);
        }

        .game-card:active {
            transform: scale(0.97);
        }

        /* Thumbnail Image Container */
        .thumbnail-box {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-box img, .thumbnail-box svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover .thumbnail-box img, 
        .game-card:hover .thumbnail-box svg {
            transform: scale(1.08);
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(5, 8, 17, 0.85);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
        }

        .game-desc {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        .play-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
        }

        /* Pink Accent Variant for Space Game */
        .pink-card {
            border-color: rgba(255, 0, 127, 0.3);
        }

        .pink-card:hover {
            border-color: var(--accent-pink);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.35);
        }

        .pink-card .badge {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        .pink-card .play-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }

        /* Fullscreen Overlay with Mobile Scale Fix */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-header {
            height: 50px;
            background-color: #0a0d18;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .active-game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .iframe-viewport {
            flex: 1;
            width: 100%;
            height: calc(100% - 50px);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .scaled-frame-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENKY'S ARCADE</h1>
        <p>Select a title to launch game</p>
    </header>

    <main class="hub-container">
        
        <!-- Game 1: Number Guessing -->
        <article class="game-card" onclick="openGame('https://venkateshchilveri99-source.github.io/Number-Guess-game/', 'Quantum Guess')">
            <div class="thumbnail-box">
                <span class="badge">PUZZLE</span>
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop" alt="Quantum Guess Code Matrix">
            </div>
            <div class="card-body">
                <div>
                    <h2 class="game-title">Quantum Guess</h2>
                    <p class="game-desc">A code-cracking number challenge. Guess secret codes with dynamic hints and track your high score.</p>
                </div>
                <button class="play-btn">LAUNCH GAME ➔</button>
            </div>
        </article>

        <!-- Game 2: Space Shooter -->
        <article class="game-card pink-card" onclick="openGame('https://venkateshchilveri99-source.github.io/space-shoot/', 'Neo Vectors')">
            <div class="thumbnail-box">
                <span class="badge">ACTION</span>
                
                <!-- 3D Toy Rocket SVG Illustration -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#110d3a"/>
                            <stop offset="50%" stop-color="#2a085c"/>
                            <stop offset="100%" stop-color="#6011a3"/>
                        </linearGradient>
                        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="70%" stop-color="#e2e8f0"/>
                            <stop offset="100%" stop-color="#cbd5e1"/>
                        </linearGradient>
                        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff4b4b"/>
                            <stop offset="100%" stop-color="#d90429"/>
                        </linearGradient>
                        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f0ff"/>
                            <stop offset="100%" stop-color="#0077b6"/>
                        </linearGradient>
                        <radialGradient id="fireGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffea00"/>
                            <stop offset="50%" stop-color="#ff6d00"/>
                            <stop offset="100%" stop-color="#d50000" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    
                    <!-- Background Sky -->
                    <rect width="800" height="500" fill="url(#bgGrad)"/>
                    
                    <!-- Clouds & Stars Background -->
                    <circle cx="150" cy="120" r="3" fill="#ffffff" opacity="0.8"/>
                    <circle cx="680" cy="90" r="4" fill="#ffffff" opacity="0.9"/>
                    <circle cx="600" cy="380" r="3" fill="#ffffff" opacity="0.6"/>
                    <path d="M 50,420 Q 150,320 280,450 T 500,480" fill="rgba(255,255,255,0.15)"/>
                    
                    <!-- Rocket Thruster Flame -->
                    <path d="M 280,310 Q 180,410 120,430 Q 220,350 310,290 Z" fill="url(#fireGrad)"/>
                    
                    <!-- 3D Rocket Group -->
                    <g transform="translate(100, -20) rotate(-15)">
                        <!-- Right Fin -->
                        <path d="M 460,260 Q 550,330 520,380 Q 430,340 430,280 Z" fill="url(#redGrad)"/>
                        
                        <!-- Left Fin -->
                        <path d="M 330,210 Q 300,310 240,330 Q 310,240 360,200 Z" fill="url(#redGrad)"/>
                        
                        <!-- Center Main Body -->
                        <path d="M 320,240 C 360,100 520,90 600,160 C 520,280 380,300 320,240 Z" fill="url(#bodyGrad)"/>
                        
                        <!-- Nose Cone -->
                        <path d="M 520,135 C 555,120 580,135 600,160 C 560,195 530,170 520,135 Z" fill="url(#redGrad)"/>
                        
                        <!-- Circular Porthole Window -->
                        <circle cx="470" cy="190" r="38" fill="url(#redGrad)"/>
                        <circle cx="470" cy="190" r="28" fill="#ffffff"/>
                        <circle cx="470" cy="190" r="22" fill="url(#glassGrad)"/>
                        
                        <!-- Bottom Fin -->
                        <path d="M 360,260 Q 350,370 290,390 Q 350,320 380,270 Z" fill="url(#redGrad)"/>
                    </g>
                    
                    <!-- Foreground Soft Clouds -->
                    <path d="M -50,520 Q 100,380 250,520 T 550,520" fill="rgba(255,255,255,0.25)"/>
                </svg>

            </div>
            <div class="card-body">
                <div>
                    <h2 class="game-title">Neo Vectors</h2>
                    <p class="game-desc">Cosmic retro-wave space shooter. Fight enemy waves, dodge obstacles, and defeat boss flagships.</p>
                </div>
                <button class="play-btn">LAUNCH GAME ➔</button>
            </div>
        </article>

    </main>

    <!-- Fullscreen Game Modal -->
    <div class="fullscreen-overlay" id="gameOverlay">
        <div class="overlay-header">
            <button class="back-btn" onclick="closeGame()">← HUB</button>
            <span class="active-game-title" id="activeGameTitle">Game</span>
            <div style="width: 50px;"></div>
        </div>
        <div class="iframe-viewport">
            <div class="scaled-frame-container" id="frameWrapper">
                <iframe class="game-iframe" id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
    </div>

    <script>
        function openGame(url, title) {
            document.body.style.overflow = 'hidden';
            const frame = document.getElementById('gameFrame');
            const wrapper = document.getElementById('frameWrapper');
            
            frame.src = url;
            document.getElementById('activeGameTitle').innerText = title;
            document.getElementById('gameOverlay').classList.add('active');

            if (window.innerWidth < 500 && url.includes('space-shoot')) {
                wrapper.style.transform = 'scale(0.92)';
                wrapper.style.transformOrigin = 'center center';
            } else {
                wrapper.style.transform = 'none';
            }
        }

        function closeGame() {
            document.body.style.overflow = '';
            document.getElementById('gameOverlay').classList.remove('active');
            document.getElementById('gameFrame').src = '';
        }
    </script>

</body>
</html>
